<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo | FuerzaFit · Efrain Cabrera Escalier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>FuerzaFit</h1>
    <p>Gimnasio y suplementos</p>
    <nav aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html" aria-current="page">Catálogo</a></li>
        <li><a href="contacto.html">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="catalogo">
      <h2>Catálogo de productos</h2>

      <div class="filtros">
        <p>
          <label for="filtro-categoria">Categoría:</label>
          <select id="filtro-categoria">
            <option value="todas">Todas</option>
            <option value="Accesorios">Accesorios</option>
            <option value="Ropa">Ropa</option>
            <option value="Suplementos">Suplementos</option>
          </select>
        </p>
        <p>
          <label for="buscador">Buscar producto:</label>
          <input type="search" id="buscador" placeholder="Ej: creatina">
        </p>
      </div>

      <div class="productos">
        <!-- Las tarjetas las dibuja app.js con los datos de productos.json -->
      </div>
    </section>

    <section id="carrito">
      <h2>Tu carrito</h2>
      <ul id="carrito-lista"></ul>
      <div id="carrito-totales"></div>
    </section>
  </main>

  <footer>
    <p>Desarrollado por Efrain Cabrera Escalier · CI …911</p>
  </footer>
</body>
</html>
