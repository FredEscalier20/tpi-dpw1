<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | FuerzaFit · Efrain Cabrera Escalier</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header>
    <h1>FuerzaFit</h1>
    <p>Gimnasio y suplementos</p>
    <nav aria-label="Menú principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="catalogo.html">Catálogo</a></li>
        <li><a href="contacto.html" aria-current="page">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section>
      <h2>Contáctanos</h2>
      <p>Escríbenos y te responderemos lo antes posible.</p>
      <form id="form-contacto" action="#" method="post" novalidate>
        <p>
          <label for="nombre">Nombre:</label>
          <input type="text" id="nombre" name="nombre">
          <span class="error" id="error-nombre" role="alert"></span>
        </p>
        <p>
          <label for="email">Correo electrónico:</label>
          <input type="email" id="email" name="email">
          <span class="error" id="error-email" role="alert"></span>
        </p>
        <p>
          <label for="asunto">Asunto:</label>
          <select id="asunto" name="asunto">
            <option value="consulta">Consulta</option>
            <option value="pedido">Pedido</option>
            <option value="reclamo">Reclamo</option>
          </select>
        </p>
        <p>
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="5" cols="40"></textarea>
          <span class="error" id="error-mensaje" role="alert"></span>
        </p>
        <button type="submit">Enviar</button>
        <p id="mensaje-exito" class="exito" role="status"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>Desarrollado por Efrain Cabrera Escalier · CI …911</p>
  </footer>
</body>
</html>
